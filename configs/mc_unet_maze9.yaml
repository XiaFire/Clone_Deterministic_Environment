defaults:
  - backbone: u_net3d

x_shape: [4, 4, 4]
max_tokens: 100
compile: false

data_mean: 0.0
data_std: 1

weight_decay: 1e-4
optimizer_beta: [0.9, 0.99]

lr_scheduler:
  name: decay_with_warmup
  num_warmup_steps: 1000
  num_training_steps: 80000

noise_level: random_uniform

uniform_future:
  enabled: false

fixed_context:
  enabled: false
  indices: null
  dropout: 0

variable_context:
  enabled: false
  prob: 0
  dropout: 0

diffusion:
  is_continuous: false
  timesteps: 1000
  beta_schedule: cosine
  schedule_fn_kwargs:
    shift: 10.0
  use_causal_mask: true
  external_cond_levels: 4
  clip_noise: 20.0
  objective: pred_v
  loss_weighting:
    strategy: fused_min_snr
    snr_clip: 20.0
    cum_snr_decay: 0.9
  sampling_timesteps: 10
  ddim_sampling_eta: 0.0

logging:
  loss_freq: 100
  grad_norm_freq: 100

backbone:
  name: u_net3d
  network_size: 128
  num_res_blocks: 2
  resnet_block_groups: 8
  dim_mults: [1, 2, 4]
  attn_resolutions: [1, 2]
  attn_dim_head: 32
  attn_heads: 4
  use_linear_attn: true
  use_init_temporal_attn: true
  init_kernel_size: 3
  dropout: 0.0
  disable_spatial_downsample: true
